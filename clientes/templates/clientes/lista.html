{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-bold mb-4">Clientes</h2>
<a href="{% url 'crear_cliente' %}" class="btn btn-primary">Nuevo Cliente</a>
<table class="min-w-full bg-white border border-gray-200">
    <thead>
        <tr>
            <th class="py-2 px-4 border-b">Nombre</th>
            <th class="py-2 px-4 border-b">RUC</th>
            <th class="py-2 px-4 border-b">Teléfono</th>
            <th class="py-2 px-4 border-b">Email</th>
        </tr>
    </thead>
    <tbody>
        {% for cliente in clientes %}
        <tr class="hover:bg-gray-100">
            <td class="py-2 px-4 border-b">{{ cliente.nombre }}</td>
            <td class="py-2 px-4 border-b">{{ cliente.ruc }}</td>
            <td class="py-2 px-4 border-b">{{ cliente.telefono }}</td>
            <td class="py-2 px-4 border-b">{{ cliente.email }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
