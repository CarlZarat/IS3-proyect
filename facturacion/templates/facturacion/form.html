{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-bold mb-4">Nueva Factura</h2>
<form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <datalist id="clientes-list">
        {% for cliente in clientes %}
        <option value="{{ cliente.nombre }}{% if cliente.ruc %} - {{ cliente.ruc }}{% endif %}"></option>
        {% endfor %}
    </datalist>
    <button type="submit">Guardar</button>
</form>
{% endblock %}
