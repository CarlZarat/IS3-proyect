{% extends "base.html" %}
{% block content %}
<h2 class="mb-4">Facturas</h2>
<a href="{% url 'crear_factura' %}" class="btn btn-primary mb-3">Nueva Factura</a>
<table class="table table-striped table-bordered">
    <thead>
        <tr>
            <th>Número</th>
            <th>Cliente</th>
            <th>Fecha</th>
            <th>Moneda</th>
            <th>Total</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for factura in facturas %}
        <tr>
            <td>{{ factura.numero }}</td>
            <td>{{ factura.cliente.nombre }}</td>
            <td>{{ factura.fecha }}</td>
            <td>{{ factura.moneda }}</td>
            <td>{{ factura.total }}</td>
            <td>
                <a href="{% url 'detalle_cuenta' factura.id %}" class="btn btn-link">Ver Detalle</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
